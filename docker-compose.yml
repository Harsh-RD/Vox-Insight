services:
  postgres:
    image: postgres:16-alpine
    container_name: voxinsight_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxinsight_dev}
      POSTGRES_DB: ${POSTGRES_DB:-voxinsight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxinsight}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxinsight_backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voxinsight}:${POSTGRES_PASSWORD:-voxinsight_dev}@postgres:5432/${POSTGRES_DB:-voxinsight}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-must-be-long-enough-32bytes}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      FAISS_INDEX_DIR: /app/data/faiss
    ports:
      - "8000:8000"
    volumes:
      - faiss_data:/app/data/faiss
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxinsight_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  faiss_data:
