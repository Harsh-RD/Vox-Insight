services:
  postgres:
    image: postgres:16-alpine
    container_name: voxinsight_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxinsight_dev}
      POSTGRES_DB: ${POSTGRES_DB:-voxinsight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxinsight}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
